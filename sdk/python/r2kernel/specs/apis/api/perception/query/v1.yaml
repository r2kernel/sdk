version: 1
id: api.perception.query.v1
kind: api_contract
name: Perception Query API Contract
description: Canonical request/response perception query API contract for bounded object scans.
procedures:
- name: scan
  request: msg.core.common.primitive.v1/StringValue
  response: msg.core.common.primitive.v1/StringValue
  timing_support: none
  semantics:
    idempotency: endpoint_defined
    side_effects: endpoint_defined
- name: front
  request: msg.core.common.primitive.v1/StringValue
  response: msg.core.common.primitive.v1/StringValue
  timing_support: none
  semantics:
    idempotency: endpoint_defined
    side_effects: endpoint_defined
- name: nearest
  request: msg.core.common.primitive.v1/StringValue
  response: msg.core.common.primitive.v1/StringValue
  timing_support: none
  semantics:
    idempotency: endpoint_defined
    side_effects: endpoint_defined
frames:
  policy: endpoint_declared
  dynamic_frames: owning_message_only
timing:
  clock_domain: r2kernel_sync
  event_envelope:
    observed: observed_at_sync_ns
    published: published_at_sync_ns
    received: received_at_sync_ns
  control_envelope:
    generated: generated_at_sync_ns
    sent: sent_at_sync_ns
    execute: execute_at_sync_ns
    valid_until: valid_until_sync_ns
state_model:
  owner: provider
  lifecycle: runtime_managed
failure_semantics:
  transport: runtime_status
  domain: endpoint_response
authority:
  owner: provider
  command_arbitration: exclusive_required_binding
limits:
  source: provider
  enforcement: provider
conformance:
  level: public
  payload_time: runtime_envelope
