version: 1
id: api.positioning.absolute_pose.v1
kind: api_contract
name: Absolute Positioning API Contract
description: Canonical absolute body-pose measurement API for positioning gateways.
events:
  - topic: position_fix
    type: msg.positioning.v1/AbsolutePoseFix
    direction: publish
    semantics:
      observation: provider_sample
      delivery: best_effort_latest
      fanout: allowed
frames:
  policy: endpoint_declared
  dynamic_frames: owning_message_only
timing:
  clock_domain: r2kernel_sync
  event_envelope:
    observed: observed_at_sync_ns
    published: published_at_sync_ns
    received: received_at_sync_ns
state_model:
  owner: provider
  lifecycle: runtime_managed
failure_semantics:
  transport: runtime_status
  domain: endpoint_response
authority:
  owner: provider
  command_arbitration: exclusive_required_binding
limits:
  source: provider
  enforcement: provider
conformance:
  level: public
  payload_time: runtime_envelope
