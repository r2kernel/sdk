version: 1
id: api.locomotion.odometry.v2
kind: api_contract
name: Locomotion Odometry API Contract
description: Canonical mobile-base odometry publication API contract.
events:
- topic: odometry
  type: msg.locomotion.mobile_base.v2/Odometry
  direction: publish
  description: Estimated pose and twist of the base frame in the odometry frame.
  semantics:
    observation: provider_sample
    delivery: best_effort_latest
    fanout: allowed
frames:
  policy: spatial_ports
  ports:
    frame_id: reference
    child_frame_id: body
  dynamic_frames: owning_message_only
timing:
  clock_domain: r2kernel_sync
  event_envelope:
    observed: observed_at_sync_ns
    published: published_at_sync_ns
    received: received_at_sync_ns
  control_envelope:
    generated: generated_at_sync_ns
    sent: sent_at_sync_ns
    execute: execute_at_sync_ns
    valid_until: valid_until_sync_ns
state_model:
  owner: provider
  lifecycle: runtime_managed
failure_semantics:
  transport: runtime_status
  domain: endpoint_response
authority:
  owner: provider
  command_arbitration: exclusive_required_binding
limits:
  source: provider
  enforcement: provider
conformance:
  level: public
  payload_time: runtime_envelope
