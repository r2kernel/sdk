version: 1
id: api.locomotion.mobile_base.state.v1
kind: api_contract
name: Mobile Base State API Contract
description: Canonical wheeled mobile-base state, fault, and drive-enable API contract.
events:
- topic: mobile_base_state
  type: msg.locomotion.mobile_base.v1/MobileBaseState
  direction: publish
  description: Current drive enable, mode, fault, command age, and applied command state.
  semantics:
    observation: provider_sample
    delivery: best_effort_latest
    fanout: allowed
- topic: fault_state
  type: msg.locomotion.mobile_base.v1/FaultState
  direction: publish
  description: Current fault latch and diagnostic text.
  semantics:
    observation: provider_sample
    delivery: best_effort_latest
    fanout: allowed
procedures:
- name: get_status
  request: msg.core.common.primitive.v1/Empty
  response: msg.locomotion.mobile_base.v1/MobileBaseState
  timing_support: none
  semantics:
    idempotency: endpoint_defined
    side_effects: endpoint_defined
- name: enable_drive
  request: msg.locomotion.mobile_base.v1/EnableDriveRequest
  response: msg.locomotion.velocity.v1/CommandAck
  timing_support: none
  semantics:
    idempotency: endpoint_defined
    side_effects: endpoint_defined
- name: disable_drive
  request: msg.locomotion.mobile_base.v1/DisableDriveRequest
  response: msg.locomotion.velocity.v1/CommandAck
  timing_support: none
  semantics:
    idempotency: endpoint_defined
    side_effects: endpoint_defined
- name: clear_fault
  request: msg.locomotion.mobile_base.v1/ClearFaultRequest
  response: msg.locomotion.velocity.v1/CommandAck
  timing_support: none
  semantics:
    idempotency: endpoint_defined
    side_effects: endpoint_defined
frames:
  policy: endpoint_declared
  dynamic_frames: owning_message_only
timing:
  clock_domain: r2kernel_sync
  event_envelope:
    observed: observed_at_sync_ns
    published: published_at_sync_ns
    received: received_at_sync_ns
  control_envelope:
    generated: generated_at_sync_ns
    sent: sent_at_sync_ns
    execute: execute_at_sync_ns
    valid_until: valid_until_sync_ns
state_model:
  owner: provider
  lifecycle: runtime_managed
failure_semantics:
  transport: runtime_status
  domain: endpoint_response
authority:
  owner: provider
  command_arbitration: exclusive_required_binding
limits:
  source: provider
  enforcement: provider
conformance:
  level: public
  payload_time: runtime_envelope
