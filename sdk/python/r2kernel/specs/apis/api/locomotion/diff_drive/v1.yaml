version: 1
id: api.locomotion.diff_drive.v1
kind: api_contract
name: Differential Drive Locomotion API Contract
description: Optional mobile-base API contract for differential-drive kinematics and wheel-level state.
events:
- topic: wheel_command
  type: msg.locomotion.mobile_base.v1/WheelCommand
  direction: publish
  description: Wheel velocity command produced by a differential-drive controller.
  semantics:
    observation: provider_sample
    delivery: best_effort_latest
    fanout: allowed
- topic: wheel_state
  type: msg.locomotion.mobile_base.v1/WheelState
  direction: publish
  description: Measured or simulated wheel state.
  semantics:
    observation: provider_sample
    delivery: best_effort_latest
    fanout: allowed
procedures:
- name: get_diff_drive_kinematics
  request: msg.core.common.primitive.v1/Empty
  response: msg.locomotion.mobile_base.v1/DiffDriveKinematics
  timing_support: none
  semantics:
    idempotency: endpoint_defined
    side_effects: endpoint_defined
- name: set_diff_drive_kinematics
  request: msg.locomotion.mobile_base.v1/DiffDriveKinematics
  response: msg.locomotion.velocity.v1/CommandAck
  timing_support: none
  semantics:
    idempotency: endpoint_defined
    side_effects: endpoint_defined
frames:
  policy: endpoint_declared
  dynamic_frames: owning_message_only
timing:
  clock_domain: r2kernel_sync
  event_envelope:
    observed: observed_at_sync_ns
    published: published_at_sync_ns
    received: received_at_sync_ns
  control_envelope:
    generated: generated_at_sync_ns
    sent: sent_at_sync_ns
    execute: execute_at_sync_ns
    valid_until: valid_until_sync_ns
state_model:
  owner: provider
  lifecycle: runtime_managed
failure_semantics:
  transport: runtime_status
  domain: endpoint_response
authority:
  owner: provider
  command_arbitration: exclusive_required_binding
limits:
  source: provider
  enforcement: provider
conformance:
  level: public
  payload_time: runtime_envelope
