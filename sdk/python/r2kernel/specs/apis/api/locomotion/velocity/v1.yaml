version: 1
id: api.locomotion.velocity.v1
kind: api_contract
name: Locomotion Velocity API Contract
description: Canonical shared locomotion body-velocity API contract with timed command validity and limit management.
controls:
- topic: velocity_command
  request: msg.locomotion.velocity.v1/VelocityCommand
  response: msg.locomotion.velocity.v1/CommandAck
  timing_support: required
  description: Apply a body velocity command with explicit synchronized timestamp and TTL.
  semantics:
    periodic: contract_defined
    validity: runtime_envelope
    scheduling: provider_dispatch
    late_behavior: reject_expired
procedures:
- name: set_velocity_limits
  request: msg.locomotion.velocity.v1/VelocityLimits
  response: msg.locomotion.velocity.v1/CommandAck
  timing_support: none
  semantics:
    idempotency: endpoint_defined
    side_effects: endpoint_defined
- name: get_velocity_limits
  request: msg.core.common.primitive.v1/Empty
  response: msg.locomotion.velocity.v1/VelocityLimits
  timing_support: none
  semantics:
    idempotency: endpoint_defined
    side_effects: endpoint_defined
- name: stop
  request: msg.locomotion.velocity.v1/StopRequest
  response: msg.locomotion.velocity.v1/CommandAck
  timing_support: none
  semantics:
    idempotency: endpoint_defined
    side_effects: endpoint_defined
frames:
  policy: endpoint_declared
  dynamic_frames: owning_message_only
timing:
  clock_domain: r2kernel_sync
  event_envelope:
    observed: observed_at_sync_ns
    published: published_at_sync_ns
    received: received_at_sync_ns
  control_envelope:
    generated: generated_at_sync_ns
    sent: sent_at_sync_ns
    execute: execute_at_sync_ns
    valid_until: valid_until_sync_ns
state_model:
  owner: provider
  lifecycle: runtime_managed
failure_semantics:
  transport: runtime_status
  domain: endpoint_response
authority:
  owner: provider
  command_arbitration: exclusive_required_binding
limits:
  source: provider
  enforcement: provider
conformance:
  level: public
  payload_time: runtime_envelope
