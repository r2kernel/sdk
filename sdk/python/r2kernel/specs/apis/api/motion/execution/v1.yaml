version: 1
id: api.motion.execution.v1
kind: api_contract
name: Motion Execution API Contract
description: Shared programmed-motion state and runtime speed scaling.
events:
- topic: execution_state
  type: msg.motion.execution.v1/ExecutionState
  direction: publish
  semantics:
    observation: provider_sample
    delivery: best_effort_latest
    fanout: allowed
procedures:
- name: set_speed_scaling
  request: msg.motion.execution.v1/SpeedScaling
  response: msg.core.common.primitive.v1/BoolValue
  timing_support: none
  semantics:
    idempotency: endpoint_defined
    side_effects: endpoint_defined
- name: get_speed_scaling
  request: msg.core.common.primitive.v1/Empty
  response: msg.motion.execution.v1/SpeedScaling
  timing_support: none
  semantics:
    idempotency: endpoint_defined
    side_effects: endpoint_defined
frames:
  policy: endpoint_declared
  dynamic_frames: owning_message_only
timing:
  clock_domain: r2kernel_sync
  event_envelope:
    observed: observed_at_sync_ns
    published: published_at_sync_ns
    received: received_at_sync_ns
  control_envelope:
    generated: generated_at_sync_ns
    sent: sent_at_sync_ns
    execute: execute_at_sync_ns
    valid_until: valid_until_sync_ns
state_model:
  owner: provider
  lifecycle: runtime_managed
failure_semantics:
  transport: runtime_status
  domain: endpoint_response
authority:
  owner: provider
  command_arbitration: exclusive_required_binding
limits:
  source: provider
  enforcement: provider
conformance:
  level: public
  payload_time: runtime_envelope
