version: 1
id: api.motion.manipulator.tooling.v1
kind: api_contract
name: Manipulator Tooling API Contract
description: Canonical manipulator tooling and payload API contract.
procedures:
- name: set_tcp
  request: msg.motion.manipulator.v1/SetTcpRequest
  response: msg.core.common.primitive.v1/BoolValue
  timing_support: none
  semantics:
    idempotency: target_idempotent
    side_effects: changes_tool_transform
- name: set_payload
  request: msg.motion.manipulator.v1/SetPayloadRequest
  response: msg.core.common.primitive.v1/BoolValue
  timing_support: none
  semantics:
    idempotency: target_idempotent
    side_effects: changes_dynamic_model
frames:
  policy: endpoint_declared
  dynamic_frames: owning_message_only
timing:
  clock_domain: r2kernel_sync
  event_envelope:
    observed: observed_at_sync_ns
    published: published_at_sync_ns
    received: received_at_sync_ns
  control_envelope:
    generated: generated_at_sync_ns
    sent: sent_at_sync_ns
    execute: execute_at_sync_ns
    valid_until: valid_until_sync_ns
state_model:
  owner: provider
  lifecycle: runtime_managed
failure_semantics:
  transport: runtime_status
  domain: endpoint_response
authority:
  owner: provider
  command_arbitration: exclusive_required_binding
limits:
  source: provider
  enforcement: provider
conformance:
  level: public
  payload_time: runtime_envelope
