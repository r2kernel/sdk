version: 1
id: api.io.analog.output.v1
kind: api_contract
name: Analog Output API Contract
description: Canonical index-addressed analog output command and state API contract.
procedures:
- name: set_analog_output
  request: msg.core.common.primitive.v1/IndexedFloat32Value
  response: msg.core.common.primitive.v1/BoolValue
  timing_support: none
  semantics:
    idempotency: target_idempotent
    side_effects: changes_physical_output
- name: get_analog_output
  request: msg.core.common.primitive.v1/UInt32Value
  response: msg.core.common.primitive.v1/Float32Value
  timing_support: none
  semantics:
    idempotency: read_only
    side_effects: none
frames:
  policy: not_applicable
  dynamic_frames: prohibited
timing:
  clock_domain: r2kernel_sync
  event_envelope:
    observed: observed_at_sync_ns
    published: published_at_sync_ns
    received: received_at_sync_ns
  control_envelope:
    generated: generated_at_sync_ns
    sent: sent_at_sync_ns
    execute: execute_at_sync_ns
    valid_until: valid_until_sync_ns
state_model:
  owner: provider
  lifecycle: runtime_managed
failure_semantics:
  transport: runtime_status
  domain: endpoint_response
authority:
  owner: provider
  command_arbitration: exclusive_required_binding
limits:
  source: provider
  enforcement: provider
conformance:
  level: public
  payload_time: runtime_envelope
