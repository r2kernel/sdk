version: 1
id: msg.motion.execution.v1
kind: message_set
description: Programmed-motion execution state and speed-scaling payloads.
messages:
  ExecutionState:
    fields:
      - name: state
        type: string
      - name: active_operation_id
        type: string
        optional: true
      - name: progress
        type: float32
        optional: true
      - name: speed_scaling
        type: float32
      - name: reason
        type: string
        optional: true
  SpeedScaling:
    fields:
      - name: value
        type: float32
