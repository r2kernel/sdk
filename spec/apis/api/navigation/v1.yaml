version: 1
id: api.navigation.v1
kind: api_contract
name: Navigation API Contract
description: Canonical navigation API contract.
events:
- topic: navigation_state
  type: msg.navigation.v1/NavigationState
  direction: publish
  semantics:
    observation: provider_sample
    delivery: best_effort_latest
    fanout: allowed
procedures:
- name: cancel_navigation
  request: msg.core.common.primitive.v1/Empty
  response: msg.core.common.primitive.v1/BoolValue
  timing_support: none
  semantics:
    idempotency: endpoint_defined
    side_effects: endpoint_defined
operations:
- name: navigate_to_pose
  request: msg.navigation.v1/NavigateToPoseRequest
  feedback: msg.navigation.v1/NavigationFeedback
  result: msg.navigation.v1/NavigationResult
  state: msg.navigation.v1/NavigationState
  timing_support: none
  semantics:
    progress: feedback_stream
    cancellation: required
    terminal_states:
    - succeeded
    - failed
    - canceled
    - rejected
- name: follow_path
  request: msg.navigation.v1/FollowPathRequest
  feedback: msg.navigation.v1/NavigationFeedback
  result: msg.navigation.v1/NavigationResult
  state: msg.navigation.v1/NavigationState
  timing_support: none
  semantics:
    progress: feedback_stream
    cancellation: required
    terminal_states:
    - succeeded
    - failed
    - canceled
    - rejected
frames:
  policy: endpoint_declared
  dynamic_frames: owning_message_only
timing:
  clock_domain: r2kernel_sync
  event_envelope:
    observed: observed_at_sync_ns
    published: published_at_sync_ns
    received: received_at_sync_ns
  control_envelope:
    generated: generated_at_sync_ns
    sent: sent_at_sync_ns
    execute: execute_at_sync_ns
    valid_until: valid_until_sync_ns
state_model:
  owner: provider
  lifecycle: runtime_managed
failure_semantics:
  transport: runtime_status
  domain: endpoint_response
authority:
  owner: provider
  command_arbitration: exclusive_required_binding
limits:
  source: provider
  enforcement: provider
conformance:
  level: public
  payload_time: runtime_envelope
