kind: r2kernel.deployment
version: 1

instances:
  gateway.device_gateway:
    package: ../../subsystems/gateway.device_gateway
    launch: managed
  component.mobile:
    package: ../../subsystems/component.mobile
    launch: managed
  component.manipulation:
    package: ../../subsystems/component.manipulation
    launch: managed
  component.gripper:
    package: ../../subsystems/component.gripper
    launch: managed
  component.incinerator:
    package: ../../subsystems/component.incinerator
    launch: managed
  component.perception:
    package: ../../subsystems/component.perception
    launch: managed
  component.localizer:
    package: ../../subsystems/component.localizer
    launch: managed
  component.navigation:
    package: ../../subsystems/component.navigation
    launch: managed

bindings:
  component.mobile.actuator_servo:
    to: gateway.device_gateway.actuator_servo
  component.manipulation.actuator_servo:
    to: gateway.device_gateway.actuator_servo
  component.gripper.digital_io:
    to: gateway.device_gateway.digital_io
  component.incinerator.timed_digital_output:
    to: gateway.device_gateway.timed_digital_output
  component.perception.radar_source:
    to: gateway.device_gateway.radar_source
  component.localizer.gnss_source:
    to: gateway.device_gateway.gnss_source
  component.localizer.odometry:
    to: component.mobile.mobile_base
  component.navigation.localization:
    to: component.localizer.localizer
  component.navigation.mobility:
    to: component.mobile.mobile_base
