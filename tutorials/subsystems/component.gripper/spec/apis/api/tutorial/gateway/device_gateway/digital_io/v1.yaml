version: 1
id: api.tutorial.gateway.device_gateway.digital_io.v1
kind: api_contract
name: Tutorial Exported Digital I/O Control Contract
description: >-
  Typed package-defined public wiring between the tutorial gripper and device
  gateway, explicitly exported for authenticated federation bindings. This
  custom contract does not define a standard robot slot. Set acknowledges the write, while readback returns the
  current output value. Output 1 is lease-controlled by the separate timed output
  contract and cannot be written through this interface.
controls:
- topic: digital_output_set
  request: msg.core.common.primitive.v1/IndexedBoolValue
  response: msg.core.common.primitive.v1/BoolValue
  timing_support: required
  semantics:
    periodic: contract_defined
    validity: runtime_envelope
    scheduling: gateway_dispatch
    late_behavior: reject_expired
- topic: digital_output_readback
  request: msg.core.common.primitive.v1/UInt32Value
  response: msg.core.common.primitive.v1/BoolValue
  timing_support: required
  semantics:
    periodic: contract_defined
    validity: runtime_envelope
    scheduling: gateway_dispatch
    late_behavior: reject_expired
frames:
  policy: endpoint_declared
  dynamic_frames: owning_message_only
timing:
  clock_domain: r2kernel_sync
  event_envelope:
    observed: observed_at_sync_ns
    published: published_at_sync_ns
    received: received_at_sync_ns
  control_envelope:
    generated: generated_at_sync_ns
    sent: sent_at_sync_ns
    execute: execute_at_sync_ns
    valid_until: valid_until_sync_ns
state_model:
  owner: provider
  lifecycle: runtime_managed
failure_semantics:
  transport: runtime_status
  domain: endpoint_response
authority:
  owner: provider
  command_arbitration: exclusive_required_binding
limits:
  source: provider
  enforcement: provider
conformance:
  level: public
  payload_time: runtime_envelope
