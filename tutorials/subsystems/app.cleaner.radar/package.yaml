schema_version: 1
name: tutorial.robot_cleaner.radar
description: Robot cleaner radar application package.
entrypoint:
  command: run.py
  args:
    - --name
    - "{{params.subsystem.name}}"
    - --manifest
    - subsystem.yaml
    - --deployment-manifest
    - "{{params.deployment.manifest}}"
    - --log-level
    - "{{params.log.level}}"
    - --auto-start
    - "{{params.behavior.auto_start}}"
    - --scan-range
    - "{{params.perception.scan_range}}"
    - --collect-distance
    - "{{params.behavior.collect_distance}}"
    - --collect-bearing-deg
    - "{{params.behavior.collect_bearing_deg}}"
    - --loop-period
    - "{{params.behavior.loop_period}}"
parameters:
  subsystem.name:
    type: string
    default: "{{instance.id}}"
  deployment.manifest:
    type: string
    default: ""
  log.level:
    type: string
    default: INFO
  behavior.auto_start:
    type: bool
    default: true
  behavior.collect_distance:
    type: number
    default: 0.18
  behavior.collect_bearing_deg:
    type: number
    default: 5.0
  behavior.loop_period:
    type: number
    default: 0.12
  perception.scan_range:
    type: number
    default: 0.30
resources:
  network:
    interfaces: []
  devices:
    paths: []
  sandbox:
    network: brokered
