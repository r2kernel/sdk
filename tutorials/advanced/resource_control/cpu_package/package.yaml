schema_version: 1
name: demo.cpu_controller
version: "0.1.0"
description: Minimal managed component package used by R2Kernel resource-control smoke tests.
entrypoint:
  command: bin/worker.sh
  args: ["3"]
  env:
    R2KERNEL_DEMO_COMPONENT: cpu_controller
resources:
  cpu:
    cores: [1]
    exclusive: true
    policy: other
  network:
    interfaces: []
  devices:
    paths: []
